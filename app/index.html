<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Myhublogistic Manager — Orders, Customers, Tracking & Purchasing</title>
<meta name="description" content="Manage orders, customers, live tracking and purchasing in one simple workspace.">
<meta name="theme-color" content="#0B1531">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B6CFF'/%3E%3Cstop offset='1' stop-color='%232FE3C2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='36' height='36' rx='11' fill='url(%23g)'/%3E%3Cpath d='M12 28 L20 20 L28 12' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='28' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink-950:#060C1E;--ink-900:#0B1531;--ink-800:#0F1B3D;--ink-700:#16234C;
  --brand:#5B6CFF;--brand-deep:#4353E8;--aqua:#2FE3C2;--sky:#38C8F4;--amber:#FFB020;--rose:#FF6B8B;--green:#22C58B;
  --bg:#F4F6FC;--card:#FFFFFF;--border:#E4E9F4;--border-2:#D4DCEE;
  --text:#0E1734;--muted:#5A6482;--faint:#5F6B87;
  --grad-brand:linear-gradient(120deg,#5B6CFF,#38C8F4 55%,#2FE3C2);
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow-sm:0 1px 3px rgba(14,23,52,.07);--shadow-md:0 10px 30px -12px rgba(14,23,52,.16);--shadow-lg:0 24px 60px -20px rgba(14,23,52,.24);
  --r-lg:18px;--r-md:13px;--r-sm:9px;
  --sidebar-w:248px;--topbar-h:64px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
::selection{background:#5B6CFF;color:#fff}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7D0E4;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#AAB6D4}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:60;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--ink-900),var(--ink-950));color:#DDE5FF;
  transition:transform .4s var(--ease)}
.side-top{display:flex;align-items:center;gap:11px;padding:20px 20px 18px}
.brand-name{font-size:1.06rem;font-weight:800;letter-spacing:-.03em;color:#fff}
.brand-name b{background:linear-gradient(100deg,#8F9EFF,#4BF0CE);-webkit-background-clip:text;background-clip:text;color:transparent}
.side-label{font-size:.66rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#5F6D96;padding:14px 22px 6px}
.side-nav{display:flex;flex-direction:column;gap:3px;padding:0 12px}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;font-size:.92rem;font-weight:600;color:#93A0C4;
  transition:background .25s,color .25s;position:relative;width:100%;text-align:left}
.side-link svg{flex:none;opacity:.8}
.side-link:hover{color:#fff;background:rgba(255,255,255,.06)}
.side-link.active{color:#fff;background:linear-gradient(90deg,rgba(91,108,255,.32),rgba(47,227,194,.1));box-shadow:inset 0 0 0 1px rgba(91,108,255,.4)}
.side-link.active svg{opacity:1;color:#8F9EFF}
.side-link .count{margin-left:auto;font-size:.68rem;font-weight:750;background:rgba(255,255,255,.1);border-radius:6px;padding:2px 7px;color:#C6CFF0}
.side-link.active .count{background:rgba(91,108,255,.5);color:#fff}
.side-spacer{flex:1}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.storage-note{font-size:.7rem;color:#5F6D96;padding:0 8px 10px;line-height:1.5}
.back-site{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;font-size:.84rem;font-weight:600;color:#93A0C4;transition:background .25s,color .25s}
.back-site:hover{color:#fff;background:rgba(255,255,255,.06)}

/* Main column */
.main{flex:1;min-width:0;margin-left:var(--sidebar-w);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 clamp(16px,3vw,28px);
  background:rgba(244,246,252,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.06rem;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:.74rem;color:var(--faint);margin-top:1px}
.search-wrap{position:relative;margin-left:auto;width:min(340px,38vw)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search-input{width:100%;padding:9px 14px 9px 36px;border-radius:11px;border:1px solid var(--border-2);background:#fff;font-size:.88rem;
  transition:border-color .25s,box-shadow .25s}
.search-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.15)}
.search-input::placeholder{color:var(--faint)}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-lg);overflow:hidden;display:none;max-height:340px;overflow-y:auto;z-index:80}
.search-results.show{display:block}
.sr-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);transition:background .2s}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:#F2F5FD}
.sr-item .sr-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(91,108,255,.1);color:var(--brand-deep);flex:none}
.sr-item .sr-t{font-size:.86rem;font-weight:650}
.sr-item .sr-s{font-size:.72rem;color:var(--faint)}
.sr-empty{padding:16px;text-align:center;font-size:.84rem;color:var(--faint)}
.topbar-actions{display:flex;align-items:center;gap:9px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:.9rem;line-height:1;
  padding:10px 17px;border-radius:11px;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .25s,border-color .25s,color .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:0 8px 22px -8px rgba(91,108,255,.55)}
.btn-primary:hover{box-shadow:0 12px 28px -8px rgba(91,108,255,.65)}
.btn-outline{background:#fff;border-color:var(--border-2);color:var(--text);box-shadow:var(--shadow-sm)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-deep)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:rgba(14,23,52,.06);color:var(--text)}
.btn-danger{background:#FFF0F3;color:#C2324F;border-color:#F7CDD6}
.btn-danger:hover{background:#FFE3E9}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:9px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.btn-icon:hover{background:rgba(14,23,52,.07);color:var(--text)}
.btn-icon.danger:hover{background:#FFE3E9;color:#C2324F}

/* View content */
.view{padding:clamp(18px,3vw,30px);max-width:1220px;width:100%;margin:0 auto}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.view-head h2{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.view-head .vh-sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.view-head .vh-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Cards & grids */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:8px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-label{font-size:.72rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kpi .k-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .k-val{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .k-foot{font-size:.76rem;color:var(--muted)}
.ico-brand{background:rgba(91,108,255,.12);color:var(--brand-deep)}
.ico-aqua{background:rgba(47,227,194,.14);color:#0E9C8A}
.ico-amber{background:rgba(255,176,32,.15);color:#B07A00}
.ico-rose{background:rgba(255,107,139,.13);color:#C2324F}

.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid-2even{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2>*,.grid-2even>*,.kpis>*,.cust-grid>*,.view>*{min-width:0}
.card,.panel-head,.panel-body{min-width:0}
.ship-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.ship-row .route{flex:1 1 170px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.panel-head h3{font-size:.98rem;font-weight:750;letter-spacing:-.015em}
.panel-head .ph-link{font-size:.82rem;font-weight:700;color:var(--brand-deep)}
.panel-body{padding:16px 20px}

/* Tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
.tbl th{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:750;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{transition:background .18s}
.tbl tbody tr:hover{background:#F7F9FE}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .id-cell{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;font-weight:700;color:var(--brand-deep)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .muted{color:var(--muted)}
.tbl .actions-cell{white-space:nowrap;text-align:right}
.link-btn{color:var(--brand-deep);font-weight:700;font-size:.85rem;background:none;padding:0}
.link-btn:hover{text-decoration:underline}
.route{display:inline-flex;align-items:center;gap:6px;font-weight:650;white-space:nowrap}
.route svg{color:var(--faint);flex:none}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:750;padding:4px 11px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.processing{color:#8A6000;background:rgba(255,176,32,.16)}
.pill.transit{color:#4353E8;background:rgba(91,108,255,.12)}
.pill.delivered{color:#06655A;background:rgba(6,101,90,.13)}
.pill.cancelled{color:#4A5570;background:rgba(74,85,112,.14)}
.pill.draft{color:#4A5570;background:rgba(74,85,112,.14)}
.pill.approved{color:#4353E8;background:rgba(91,108,255,.12)}
.pill.received{color:#0B6571;background:rgba(11,101,113,.12)}
.pill.paid{color:#06655A;background:rgba(6,101,90,.13)}
.pill.pending{color:#8A6000;background:rgba(255,176,32,.16)}
.pill.out{color:#4353E8;background:rgba(91,108,255,.12)}
.pill.vip{color:#8A6000;background:rgba(255,176,32,.17)}

/* Filter tabs */
.ftabs{display:flex;gap:6px;background:#E9EDF7;border:1px solid var(--border);padding:5px;border-radius:12px;flex-wrap:wrap}
.ftab{padding:7px 15px;border-radius:9px;font-size:.84rem;font-weight:650;color:var(--muted);transition:all .25s}
.ftab:hover{color:var(--text)}
.ftab.active{background:#fff;color:var(--text);box-shadow:var(--shadow-sm);font-weight:700}

/* Progress bars */
.pbar{height:6px;border-radius:99px;background:#E6EBF6;overflow:hidden;min-width:60px}
.pbar>span{display:block;height:100%;border-radius:99px;background:var(--grad-brand)}

/* Timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--brand),var(--aqua));border-radius:2px;opacity:.4}
.tl-item{position:relative;padding:7px 0}
.tl-item::before{content:"";position:absolute;left:-24px;top:13px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.tl-item:last-child::before{border-color:var(--aqua)}
.tl-item .tl-t{font-size:.88rem;font-weight:650}
.tl-item .tl-d{font-size:.72rem;color:var(--faint);margin-top:1px}

/* Stepper */
.stepper{display:flex;align-items:center;margin:6px 0 2px}
.step{flex:1;text-align:center;position:relative}
.step .s-dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#E6EBF6;color:var(--faint);font-size:.72rem;font-weight:800;position:relative;z-index:1;transition:all .3s}
.step.done .s-dot{background:var(--grad-brand);color:#fff}
.step .s-lbl{font-size:.68rem;font-weight:700;color:var(--faint);margin-top:6px;display:block;text-transform:uppercase;letter-spacing:.06em}
.step.done .s-lbl{color:var(--brand-deep)}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#E6EBF6}
.step:first-child::before{display:none}
.step.done::before{background:var(--brand)}

/* Empty states */
.empty{padding:46px 24px;text-align:center;color:var(--muted)}
.empty .e-ico{width:58px;height:58px;border-radius:16px;background:rgba(91,108,255,.09);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty h4{font-size:1.02rem;font-weight:750;color:var(--text);margin-bottom:6px}
.empty p{font-size:.87rem;max-width:380px;margin:0 auto 18px}

/* Avatars */
.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:.68rem;font-weight:750;color:#fff;letter-spacing:.02em}
.av-0{background:linear-gradient(135deg,#5B6CFF,#38C8F4)}
.av-1{background:linear-gradient(135deg,#F59E0B,#FF6B8B)}
.av-2{background:linear-gradient(135deg,#22C58B,#2FE3C2)}
.av-3{background:linear-gradient(135deg,#8B5CF6,#5B6CFF)}
.av-4{background:linear-gradient(135deg,#FF6B8B,#FFB020)}
.av-5{background:linear-gradient(135deg,#0EA5E9,#22C58B)}

/* Customer cards */
.cust-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cust-card{padding:20px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.cust-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.cust-top{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.cust-top .avatar{width:44px;height:44px;font-size:.85rem}
.cust-name{font-size:1rem;font-weight:750;letter-spacing:-.015em}
.cust-sub{font-size:.78rem;color:var(--faint)}
.cust-stats{display:flex;gap:10px;margin-top:14px}
.cust-stat{flex:1;background:#F5F7FC;border:1px solid var(--border);border-radius:11px;padding:9px 12px}
.cust-stat .cs-v{font-size:.95rem;font-weight:800;letter-spacing:-.02em}
.cust-stat .cs-l{font-size:.66rem;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.07em}

/* ============ MODALS ============ */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(8,14,34,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(560px,100%);max-height:min(86vh,780px);display:flex;flex-direction:column;background:#fff;border-radius:22px;
  box-shadow:var(--shadow-lg);transform:translateY(18px) scale(.97);transition:transform .35s var(--ease)}
.modal-overlay.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 0}
.modal-head h3{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.modal-x{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s}
.modal-x:hover{background:#EEF1F9;color:var(--text)}
.modal-body{padding:18px 24px 6px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.field label .req{color:var(--rose)}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--border-2);background:#fff;font-size:.9rem;
  transition:border-color .25s,box-shadow .25s}
.field textarea{resize:vertical;min-height:74px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.14)}
.field input.invalid,.field select.invalid{border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,107,139,.15)}
.field .hint{font-size:.72rem;color:var(--faint);margin-top:5px}
.field-total{display:flex;align-items:center;justify-content:space-between;background:#F0F3FB;border:1px dashed var(--border-2);border-radius:12px;padding:12px 15px;margin-top:2px}
.field-total .ft-l{font-size:.8rem;font-weight:700;color:var(--muted)}
.field-total .ft-v{font-size:1.05rem;font-weight:800;color:var(--text)}
/* Detail modal */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.d-item{background:#F7F9FE;border:1px solid var(--border);border-radius:12px;padding:11px 14px}
.d-item .di-l{font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.d-item .di-v{font-size:.92rem;font-weight:650;margin-top:3px;word-break:break-word}

/* ============ TOASTS ============ */
.toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 40px))}
.toast{display:flex;align-items:center;gap:11px;background:var(--ink-900);color:#fff;border-radius:14px;padding:13px 17px;
  box-shadow:var(--shadow-lg);font-size:.87rem;font-weight:600;animation:toastIn .45s var(--ease)}
.toast.out{animation:toastOut .35s var(--ease) forwards}
.toast .t-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.toast.ok .t-ico{background:rgba(47,227,194,.25);color:#4BF0CE}
.toast.warn .t-ico{background:rgba(255,176,32,.25);color:#FFC966}
.toast.err .t-ico{background:rgba(255,107,139,.25);color:#FF9FB6}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

/* ============ WORKFLOW MAP ============ */
.wf-card{margin-bottom:22px}
.wf-svg{width:100%;height:auto;display:block;padding:6px 8px 0}
.wf-lane{cursor:pointer}
.wf-lane:hover .wf-lane-bg,.wf-lane:focus .wf-lane-bg{fill:#EDF1FF;stroke:#B9C6FF}
.wf-lane:focus{outline:none}
.wf-lane-bg{fill:#F8FAFE;stroke:#E4E9F4;transition:fill .25s}
.wf-node{fill:#fff;stroke:#D4DCEE}
.wf-hub{fill:#EEF2FF;stroke:#5B6CFF;stroke-width:1.5}
.wf-h{font-size:.98rem;font-weight:750;letter-spacing:-.015em}
.wf-title{font:800 13px var(--font);fill:#0E1734;letter-spacing:.04em}
.wf-sub{font:600 10px var(--font);fill:#51607E}
.wf-n{font:700 12px var(--font);fill:#0E1734}
.wf-ns{font:600 9.5px var(--font);fill:#51607E}
.wf-hub-t{font:800 14px var(--font);fill:#1D2E8F;letter-spacing:.06em}
.wf-hub-s{font:600 9.5px var(--font);fill:#4353E8}
.wf-arrow{stroke:#8B9BC4;stroke-width:2;marker-end:url(#wfAh)}
.wf-fee{font:700 9.5px var(--font);fill:#4353E8}
.wf-fee-s{font:600 9px var(--font);fill:#51607E}
.wf-dot{fill:#5B6CFF;opacity:.85}
.wf-dot2{fill:#2FE3C2}
.wf-modes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px 14px;border-top:1px solid var(--border)}
.wf-chip{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:650;color:var(--muted);background:#F5F7FC;border:1px solid var(--border);border-radius:99px;padding:6px 13px}
.wf-chip svg{color:var(--brand-deep)}
.wf-chip b{color:var(--text)}
.wf-hint{margin-left:auto;font-size:.78rem;color:var(--muted);display:inline-flex;gap:6px;flex-wrap:wrap}
/* ============ ITEM EDITOR ============ */
.item-head,.item-row{display:grid;grid-template-columns:minmax(0,1fr) 52px 82px 82px 30px;gap:8px;align-items:center}
.fs-input{width:130px;text-align:right;padding:8px 12px;border-radius:9px;border:1px solid var(--border-2);font-size:.92rem;font-weight:700;background:#fff}
.fs-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.14)}
.item-row input{min-width:0}
.ir-type{width:34px;height:34px;border-radius:9px;font-weight:800;font-size:.74rem;cursor:pointer;transition:filter .2s;border:1px solid transparent}
.ir-type.t-goods{background:#FFF3DD;color:#8A6000;border-color:#F0D8A8}
.ir-type.t-logi{background:#E9EDFF;color:#4353E8;border-color:#C9D4FF}
.ir-type:hover{filter:brightness(.94)}
.fee-box{display:flex;flex-direction:column;gap:9px;background:#F7F9FE;border:1px solid var(--border);border-radius:12px;padding:13px 16px}
.fs-row{display:flex;justify-content:space-between;align-items:center;font-size:.88rem}
.fs-l{color:var(--muted);font-weight:650}
.fs-total{border-top:1px dashed var(--border-2);padding-top:10px;margin-top:2px}
.ty-chip{display:inline-block;font-size:.58rem;font-weight:800;letter-spacing:.05em;border-radius:5px;padding:2px 6px;vertical-align:1px;margin-left:6px}
.ty-chip.ty-goods{background:#FFF3DD;color:#8A6000}
.ty-chip.ty-logi{background:#E9EDFF;color:#4353E8}
.subrow td{color:var(--muted);font-weight:600}
.item-head{font-size:.66rem;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:6px}
.item-rows{display:flex;flex-direction:column;gap:8px}
.item-row input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border-2);font-size:.88rem;background:#fff;min-width:0}
.item-row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.12)}
.ir-total{font-size:.84rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ir-x{width:30px;height:30px;border-radius:8px;color:#C2324F;background:#FFF0F3;font-size:.78rem;line-height:1;transition:background .2s}
.ir-x:hover{background:#FFE3E9}
/* ============ PAYMENTS ============ */
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;background:#F7F9FE;border:1px solid var(--border);border-radius:10px;font-size:.85rem}
.pay-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pay-add input,.pay-add select{padding:9px 12px;border-radius:10px;border:1px solid var(--border-2);font-size:.86rem;background:#fff}
.pay-add input:focus,.pay-add select:focus{outline:none;border-color:var(--brand)}
/* ============ PRINT ============ */
#print-area{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .app,.toasts,.modal-overlay,.to-top{display:none!important}
  #print-area{display:block}
  .pr-doc{font-family:var(--font);color:#0E1734;max-width:740px;margin:0 auto;font-size:13px}
  .pr-top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #5B6CFF;padding-bottom:14px;margin-bottom:18px}
  .pr-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
  .pr-title{font-size:1.25rem;font-weight:800;letter-spacing:.08em;color:#5B6CFF}
  .pr-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-bottom:18px;font-size:.92rem}
  .pr-meta b{display:block;font-size:.64rem;text-transform:uppercase;color:#8B94B0;letter-spacing:.09em;font-weight:750;margin-bottom:2px}
  .pr-table{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:16px}
  .pr-table th{text-align:left;border-bottom:2px solid #0E1734;padding:8px 10px;font-size:.66rem;text-transform:uppercase;letter-spacing:.09em}
  .pr-table td{border-bottom:1px solid #D4DCEE;padding:9px 10px}
  .pr-table .num,.pr-totals .num{text-align:right}
  .pr-totals{margin-left:auto;width:290px;font-size:.95rem}
  .pr-totals div{display:flex;justify-content:space-between;padding:7px 12px}
  .pr-totals .grand{border-top:2px solid #0E1734;font-weight:800;font-size:1.05rem;margin-top:4px}
  .pr-foot{margin-top:28px;padding-top:12px;border-top:1px solid #D4DCEE;color:#5A6482;font-size:.82rem;text-align:center}
}
/* ============ MOBILE ============ */
.menu-btn{display:none;width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--border-2);position:relative;flex:none}
.menu-btn span{position:absolute;left:11px;right:11px;height:2px;border-radius:2px;background:var(--text);transition:all .3s var(--ease)}
.menu-btn span:nth-child(1){top:14px}.menu-btn span:nth-child(2){top:19px}.menu-btn span:nth-child(3){top:24px}
.side-backdrop{display:none;position:fixed;inset:0;z-index:55;background:rgba(8,14,34,.5);opacity:0;pointer-events:none;transition:opacity .3s}
@media (max-width:1020px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:none;box-shadow:var(--shadow-lg)}
  body.nav-open .side-backdrop{display:block;opacity:1;pointer-events:auto}
  .main{margin-left:0}
  .menu-btn{display:block}
  .kpis{grid-template-columns:1fr 1fr}
  .grid-2,.grid-2even{grid-template-columns:1fr}
  .search-wrap{width:min(260px,44vw)}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi .k-val{font-size:1.25rem}
  .view{padding:16px 14px}
  .view-head h2{font-size:1.25rem}
  .search-wrap{display:none}
  .form-grid{grid-template-columns:1fr}
  .item-head{display:none}
  .item-row{grid-template-columns:minmax(0,1fr) 44px 66px 30px 28px}
  .item-row.no-type{grid-template-columns:minmax(0,1fr) 44px 66px 28px}
  .item-row input{padding:8px 6px}
  .ir-type{width:30px;height:30px}
  .ir-total{display:none}
  .modal{border-radius:18px}
  .tbl th,.tbl td{padding:9px 10px}
}
@media print{.sidebar,.topbar,.toasts,.vh-actions{display:none!important}.main{margin:0}}

<script>
(function(){
'use strict';
/* ================= HELPERS ================= */
var $=function(s,c){return (c||document).querySelector(s)};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function money(n){var cur=(S.settings&&S.settings.currency)||'$';return cur+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
function fmtDate(d){try{var x=new Date(d);return isNaN(x)?'—':x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return '—'}}
function fmtDateTime(d){try{var x=new Date(d);return isNaN(x)?'—':x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}}
function today(){return new Date().toISOString().slice(0,10)}
function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||''}).join('').toUpperCase()}
function avClass(id){return 'av-'+(Math.abs(String(id).split('').reduce(function(a,c){return a+c.charCodeAt(0)},0))%6)}
function uid(prefix){S.counters=S.counters||{};S.counters[prefix]=(S.counters[prefix]||1000)+1;return prefix+'-'+S.counters[prefix]}
function custById(id){return S.customers.filter(function(c){return c.id===id})[0]}
function supById(id){return S.suppliers.filter(function(c){return c.id===id})[0]}
function orderBy_Tracking(oid){return S.trackings.filter(function(t){return t.orderId===oid})[0]}
function ordersOf(cid){return S.orders.filter(function(o){return o.customerId===cid})}
function sum(arr,f){return arr.reduce(function(a,x){return a+(f?f(x):x)},0)}
function orderValue(o){var f=feesBreakdown(o);return f.sup+f.logi}
function payState(o){var total=orderValue(o);var paid=sum(o.payments||[],function(p){return Number(p.amount)||0});var bal=Math.max(0,Math.round((total-paid)*100)/100);return{total:total,paid:paid,balance:bal,state:paid<=0?'unpaid':(bal<=0.004?'paid':'partial')}}
function payPill(o){var st=payState(o);var cls=st.state==='paid'?'paid':st.state==='partial'?'pending':'draft';return '<span class="pill '+cls+'"><i></i>'+st.state.charAt(0).toUpperCase()+st.state.slice(1)+'</span>'}
function normalizeState(){
  (S.orders||[]).forEach(function(o){
    if(!Array.isArray(o.items))o.items=[{name:String(o.items||o.itemsSummary||'Items'),qty:Number(o.quantity)||1,unitPrice:Number(o.value)||0}];
    if(!o.itemsSummary)o.itemsSummary=o.items.map(function(i){return i.name}).join('; ');
    if(!Array.isArray(o.payments))o.payments=[];
    if(!o.unit)o.unit='supply';if(!o.mode)o.mode='land';
    if(o.supplierFees==null||o.logisticsFees==null){
      var lg=0,keep=[];
      (o.items||[]).forEach(function(it){if(it&&it.type==='logi')lg+=itemLineTotal(it);else keep.push(it)});
      o.items=keep;o.supplierFees=0;o.logisticsFees=lg;
    }
    o.value=(Number(o.supplierFees)||0)+(Number(o.logisticsFees)||0);
    o.quantity=sum(o.items,function(i){return Number(i.qty)||0});
    o.value=orderValue(o);
  });
  (S.pos||[]).forEach(function(p){
    if(!Array.isArray(p.items))p.items=[{name:String(p.description||'Items'),qty:Number(p.quantity)||1,unitPrice:Number(p.unitPrice)||0}];
    p.quantity=sum(p.items,function(i){return Number(i.qty)||0});
    p.amount=sum(p.items,function(i){return (Number(i.qty)||0)*(Number(i.unitPrice)||0)});
    p.description=p.items.map(function(i){return i.name}).join('; ');
  });
  (S.suppliers||[]).forEach(function(s){['contact','category','email','phone','city','address','notes'].forEach(function(k){if(!(k in s))s[k]=''})});
}
/* item editor */
function itemRowHTML(it,noType){
  var t=(it&&it.type)||'goods';
  return '<div class="item-row'+(noType?' no-type':'')+'">'+
  '<input class="ir-name" placeholder="Item description" value="'+esc(it?it.name:'')+'" aria-label="Item description">'+
  '<input class="ir-qty" type="number" min="1" step="1" value="'+(it?it.qty:1)+'" aria-label="Quantity">'+
  '<input class="ir-unit" type="number" min="0" step="0.01" value="'+(it&&it.unitPrice!=null?it.unitPrice:'')+'" placeholder="0.00" aria-label="Unit price">'+
  (noType?'':'<button type="button" class="ir-type t-'+t+'" data-type="'+t+'" title="Fee type: '+(t==='logi'?'Logistics fee':'Supplier fee')+' — click to switch" onclick="itemToggle(this)" aria-label="Switch fee type">'+(t==='logi'?'L':'S')+'</button>')+
  '<span class="ir-total">'+money(it?itemLineTotal(it):0)+'</span>'+
  '<button type="button" class="ir-x" onclick="itemRemove(this)" aria-label="Remove item">✕</button></div>'

var lastFocus=null;

  lastFocus=document.activeElement;
  $('#modal-title').textContent=title;
  $('#modal-body').innerHTML=bodyHTML;
  $('#modal-foot').innerHTML=footHTML;
  $('#modal-overlay').classList.add('show');
  if(onMount)onMount();
  var first=$('#modal-body input,#modal-body select,#modal-body textarea,#modal-foot .btn');
  if(first)setTimeout(function(){first.focus()},60);
}
function closeModal(){
  $('#modal-overlay').classList.remove('show');
  setTimeout(function(){if(!$('#modal-overlay').classList.contains('show')){$('#modal-body').innerHTML='';$('#modal-foot').innerHTML=''}},330);
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}

});

  if(!S.customers.length){toast('Add a customer first','warn');location.hash='#/customers';return}
  openModal(o?'Edit order '+o.id:'New order',orderForm(o),
  '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="of-save">'+(o?'Save changes':'Create order')+'</button>',

    itemRecalc($('#of-items'));
    function syncFeeBox(){var u=$('#of-unit').value;$('#of-row-sup').style.display=u==='logi'?'none':'flex'}
    $('#of-unit').addEventListener('change',function(){syncFeeBox()});
    $('#of-sup').addEventListener('input',ofFeeTotal);$('#of-logi').addEventListener('input',ofFeeTotal);
    syncFeeBox();
    $('#of-save').onclick=function(){
      var cust=$('#of-cust'),origin=$('#of-origin'),dest=$('#of-dest');
      [cust,origin,dest].forEach(function(el){el.classList.remove('invalid')});
      if(!cust.value||!origin.value.trim()||!dest.value.trim()){[cust,origin,dest].forEach(function(el){if(!el.value||(el!==cust&&!el.value.trim()))el.classList.add('invalid')});toast('Please fill the required fields','err');return}

      saveState();closeModal();route();
    };
  });
}

function payAdd(oid){
  var o=S.orders.filter(function(x){return x.id===oid})[0];if(!o)return;
  var st=payState(o);var amt=parseFloat($('#pd-amt').value);
  if(!amt||amt<=0){toast('Enter a payment amount','err');return}
  if(amt>st.balance+0.01){toast('Amount exceeds the '+money(st.balance)+' balance','err');return}
  o.payments.push({id:uid('P'),amount:Math.round(amt*100)/100,method:$('#pd-method').value,date:$('#pd-date').value||today()});
  saveState();toast(money(amt)+' payment recorded');route();orderDetail(oid);
}
function payDel(oid,pid){
  var o=S.orders.filter(function(x){return x.id===oid})[0];if(!o)return;
  o.payments=o.payments.filter(function(p){return p.id!==pid});
  saveState();toast('Payment removed','warn');route();orderDetail(oid);
}

function trkNewFor(orderId){
  if(!S.orders.length){toast('Create an order first','warn');location.hash='#/orders';return}
  openModal('New shipment tracker',trkForm(null,orderId),
  '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="tf-save">Create tracker</button>',
  function(){
    $('#tf-save').onclick=function(){
      var ord=$('#tf-order'),car=$('#tf-carrier');
      if(!ord.value||!car.value.trim()){[ord,car].forEach(function(el){if(!el.value)el.classList.add('invalid')});toast('Select an order and carrier','err');return}
      var id=uid('T');
      var trk={id:id,code:'MH-'+(7000+(S.counters['T']-1001)),orderId:ord.value,carrier:car.value.trim(),status:$('#tf-status').value,progress:parseInt($('#tf-prog').value,10)||0,events:[],createdAt:Date.now()};
      var ev=$('#tf-event').value;
      if(ev)trk.events.push({label:ev,note:'',at:new Date().toISOString()});
      S.trackings.unshift(trk);saveState();toast('Tracker '+trk.code+' created');closeModal();route();
    };
  });

function trkDetail(id){
  var t=S.trackings.filter(function(x){return x.id===id})[0];if(!t)return;
  var o=S.orders.filter(function(x){return x.id===t.orderId})[0];var c=o?custById(o.customerId):null;
  var nextMap={pending:'picked_up',picked_up:'in_transit',in_transit:'out_for_delivery',out_for_delivery:'delivered'};
  var next=nextMap[t.status];
  var body='<div class="detail-grid">'+
  '<div class="d-item"><div class="di-l">Tracking code</div><div class="di-v id-cell">'+esc(t.code)+'</div></div>'+
  '<div class="d-item"><div class="di-l">Status</div><div class="di-v">'+statusPill(TRK_STATUS,t.status)+'</div></div>'+
  '<div class="d-item"><div class="di-l">Order</div><div class="di-v"><button class="link-btn" onclick="closeModal();orderDetail(\''+t.orderId+'\')">'+esc(t.orderId)+'</button></div></div>'+
  '<div class="d-item"><div class="di-l">Carrier</div><div class="di-v">'+esc(t.carrier)+'</div></div>'+
  '<div class="d-item"><div class="di-l">Route</div><div class="di-v">'+esc(o?o.origin+' → '+o.destination:'—')+'</div></div>'+
  '<div class="d-item"><div class="di-l">Customer</div><div class="di-v">'+esc(c?c.name:'—')+'</div></div></div>';
  body+='<div style="margin:6px 0 16px"><div style="display:flex;justify-content:space-between;font-size:.74rem;color:var(--faint);margin-bottom:6px"><span>Progress</span><span>'+t.progress+'%</span></div><div class="pbar"><span style="width:'+t.progress+'%"></span></div></div>';
  body+='<div class="panel-head" style="padding:8px 0"><h3 style="font-size:.85rem">Event timeline</h3></div><div class="timeline" style="margin:12px 0 4px">';
  if(!t.events.length)body+='<div style="color:var(--faint);font-size:.85rem">No events yet — add one below</div>';
  t.events.slice().reverse().forEach(function(e){body+='<div class="tl-item"><div class="tl-t">'+esc(e.label)+'</div>'+(e.note?'<div style="font-size:.8rem;color:var(--muted)">'+esc(e.note)+'</div>':'')+'<div class="tl-d">'+fmtDateTime(e.at)+'</div></div>'});
  body+='</div>';
  body+='<div class="field full" style="margin-top:12px"><label>Add event</label><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="td-event" aria-label="Select event to add" style="flex:1;min-width:140px;padding:10px 13px;border-radius:11px;border:1px solid var(--border-2)">'+['Picked up','Departed origin','Arrived at hub','In transit','Out for delivery','Delivered','Delayed','Customs hold','Exception'].map(function(e){return '<option>'+e+'</option>'}).join('')+'</select><button class="btn btn-outline" id="td-add">Add</button></div></div>';
  var foot='';
  if(next)foot+='<button class="btn btn-outline" onclick="trkAdvance(\''+t.id+'\',\''+next+'\')">Advance → '+TRK_STATUS[next]+'</button>';
  foot+='<button class="btn btn-ghost" style="color:#C2324F" onclick="trkDelete(\''+t.id+'\')">Delete</button><button class="btn btn-primary" onclick="closeModal()">Done</button>';
  openModal('Shipment '+t.code,body,foot,function(){
    $('#td-add').onclick=function(){
      var label=$('#td-event').value;
      var pr={pending:10,picked_up:25,in_transit:55,out_for_delivery:85,delivered:100}[t.status]||t.progress;
      t.events.push({label:label,note:'Manual update',at:new Date().toISOString()});
      if(/Delayed|hold|Exception/i.test(label)){t.status='exception'}else{t.progress=Math.max(t.progress,pr)}
      saveState();toast('Event "'+label+'" added');closeModal();trkDetail(t.id);route();
    };
  });
}
function trkAdvance(id,next){
  var t=S.trackings.filter(function(x){return x.id===id})[0];if(!t)return;
  t.status=next;var pr={pending:10,picked_up:25,in_transit:55,out_for_delivery:85,delivered:100}[next]||t.progress;
  t.progress=Math.max(t.progress,pr);
  t.events.push({label:TRK_STATUS[next],note:'Status advanced',at:new Date().toISOString()});
  if(next==='delivered'){var o=S.orders.filter(function(x){return x.id===t.orderId})[0];if(o&&o.status!=='delivered'){o.status='delivered'}}
  saveState();toast(t.code+' → '+TRK_STATUS[next]);closeModal();trkDetail(id);route();
}
function trkDelete(id){
  confirmDialog('Delete tracker?','The shipment tracker will be removed. The order itself is kept.',function(){
    S.trackings=S.trackings.filter(function(t){return t.id!==id});saveState();toast('Tracker deleted','warn');closeModal();route();
  });
}

      html+='<div class="card cust-card" style="cursor:pointer" onclick="supDetail(\''+s.id+'\')"><div class="cust-top"><span class="avatar '+avClass(s.id)+'">'+initials(s.name)+'</span><div style="min-width:0;flex:1"><div class="cust-name">'+esc(s.name)+'</div><div class="cust-sub">'+esc(s.category||'Supplier')+(s.city?' · '+esc(s.city):'')+'</div></div></div>'+
      '<div style="display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)">'+(s.contact?'<span>👤 '+esc(s.contact)+'</span>':'')+(s.phone?'<span>☎ '+esc(s.phone)+'</span>':'')+(s.email?'<span>✉ '+esc(s.email)+'</span>':'')+'</div>'+
      '<div class="cust-stats"><div class="cust-stat"><div class="cs-v">'+ps.length+'</div><div class="cs-l">POs</div></div><div class="cust-stat"><div class="cs-v">'+money(spend)+'</div><div class="cs-l">Spend</div></div></div>'+
      '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-outline btn-sm" style="flex:1" onclick="event.stopPropagation();poNewFor(\''+s.id+'\')">New PO</button><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();supEdit(\''+s.id+'\')">Edit</button><button class="btn-icon danger" title="Delete" onclick="event.stopPropagation();supDelete(\''+s.id+'\')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div>';
    });
    html+='</div>';
  }
  $('#view').innerHTML=html;
};

  html+='<div class="grid-2even" style="margin-bottom:16px">'+

  '<div class="field"><label>Currency symbol</label><select id="set-currency">'+['$','€','£','¥','₩','Rs','K','฿'].map(function(c){return '<option'+(S.settings.currency===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select><div class="hint">Used across orders & POs</div></div>'+
  '<button class="btn btn-primary" style="margin-top:16px" onclick="settingsSave()">Save settings</button></div></div>'+

  '<div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">Storage location</span><b>'+(memoryOnly?'⚠ Preview only — not persisting':'✅ This device (browser local storage)')+'</b></div>'+
  '<div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">Data name</span><b>myhub</b></div>'+
  '<div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">Size used</span><b>'+Math.max(1,Math.round(JSON.stringify(S).length/1024))+' KB</b></div>'+
  '<div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">Internet needed</span><b>No — works fully offline</b></div>'+
  '<div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">Sent to any server</span><b>Never — data stays on device</b></div>'+
  '</div><p style="font-size:.8rem;color:var(--muted);margin-bottom:14px">Tip: install the app (browser menu → <b>Install app</b> / <b>Add to Home Screen</b>) so it opens and works with zero internet. Export a backup file regularly for safety.</p>'+
  '<div style="display:flex;flex-direction:column;gap:10px">'+
  '<button class="btn btn-outline" onclick="exportJSON()">⬇ Export backup (JSON)</button>'+
  '<button class="btn btn-outline" onclick="exportCSV(\'all\')">⬇ Export CSV (all tables)</button>'+
  '<label class="btn btn-outline" style="cursor:pointer">⬆ Import backup (JSON)<input type="file" id="import-file" accept=".json,application/json" style="display:none"></label>'+
  '</div></div></div></div>';
  html+='<div class="card"><div class="panel-head"><h3>Danger zone</h3></div><div class="panel-body" style="display:flex;gap:10px;flex-wrap:wrap">'+
  '<button class="btn btn-outline" onclick="seedDemoConfirm()">↺ Load demo data</button>'+

function settingsSave(){
  S.settings.companyName=$('#set-company').value.trim()||'My Company';
  S.settings.currency=$('#set-currency').value;
  saveState();toast('Settings saved');route();
}
function download(filename,content,type){
  try{
    var blob=new Blob([content],{type:type||'text/plain'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400);
    toast('Downloaded '+filename);
  }catch(e){toast('Download failed in this preview','err')}
}
function exportJSON(){download('myhub-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json')}
function importJSON(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      if(!data.orders||!data.customers)throw 0;
      confirmDialog('Import backup?','This will replace ALL current data with the backup file.',function(){
        S=data;saveState();toast('Backup imported');route();
      },'Import');
    }catch(err){toast('Invalid backup file','err')}
  };
  r.readAsText(file);e.target.value='';
}
function csvRows(rows){return rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\n')}
function exportCSV(what){
  var files=[];
  if(what==='orders'||what==='all'){
    files.push(['orders.csv',[['Order','Customer','Unit','Mode','Origin','Destination','Items','Qty','GoodsPrice','SupplierFees','LogisticsFees','TotalFees','Paid','Balance','Payment','Status','ETA','Created']].concat(S.orders.map(function(o){var st=payState(o);var fb=feesBreakdown(o);return [o.id,(custById(o.customerId)||{}).name||'',UNIT[o.unit||'supply'],MODE[o.mode||'land'],o.origin,o.destination,o.itemsSummary,o.quantity,goodsValue(o),fb.sup,fb.logi,o.value,st.paid,st.balance,st.state,ORD_STATUS[o.status],o.eta,new Date(o.createdAt).toISOString()]}))]);
  }
  if(what==='pos'||what==='all'){
    files.push(['purchase-orders.csv',[['PO','Supplier','Description','Qty','Unit price','Amount','Status','Created']].concat(S.pos.map(function(p){return [p.id,(supById(p.supplierId)||{}).name||'',p.description,p.quantity,p.unitPrice,p.amount,PO_STATUS[p.status],new Date(p.createdAt).toISOString()]}))]);
  }
  if(what==='suppliers'||what==='all'){
    files.push(['suppliers.csv',[['ID','Name','Contact','Category','Email','Phone','City','Address','Notes']].concat(S.suppliers.map(function(s){return [s.id,s.name,s.contact,s.category,s.email,s.phone,s.city||'',s.address||'',s.notes||'']}))]);
  }
  if(what==='all'){
    files.push(['customers.csv',[['ID','Name','Contact','Email','Phone','City','Address','VIP','Notes']].concat(S.customers.map(function(c){return [c.id,c.name,c.contact,c.email,c.phone,c.city,c.address,c.vip?'Yes':'',c.notes]}))]);
    files.push(['tracking.csv',[['Code','Order','Carrier','Status','Progress','Events']].concat(S.trackings.map(function(t){return [t.code,t.orderId,t.carrier,TRK_STATUS[t.status],t.progress+'%',t.events.map(function(e){return e.label}).join(' > ')]}))]);
  }
  files.forEach(function(f,i){setTimeout(function(){download(f[0],csvRows(f[1]),'text/csv')},i*350)});
}
function seedDemoConfirm(){confirmDialog('Load demo data?','Sample customers, orders, trackers and POs will be added for you to explore. Current data will be replaced.',function(){localStorageTryRemove();S=defaultState();seedDemo();toast('Demo data loaded');route()},'Load demo')}
function clearAllConfirm(){confirmDialog('Clear all data?','Everything — orders, customers, tracking, POs, suppliers — will be permanently deleted from this browser.',function(){localStorageTryRemove();S=defaultState();S.seeded=true;saveState();toast('All data cleared','warn');route()},'Clear everything')}
function localStorageTryRemove(){try{localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_KEY_OLD)}catch(e){}}

/* ================= GLOBAL SEARCH ================= */
var searchTimer=null;
function hideSearch(){$('#search-results').classList.remove('show')}
$('#global-search').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  if(q.length<1){hideSearch();return}
  searchTimer=setTimeout(function(){runSearch(q)},160);
});
$('#global-search').addEventListener('focus',function(){if(this.value.trim().length>0)runSearch(this.value.trim().toLowerCase())});
document.addEventListener('click',function(e){if(!e.target.closest('.search-wrap'))hideSearch()});
function runSearch(q){
  var out=[];
  S.orders.forEach(function(o){var c=custById(o.customerId);var hay=(o.id+' '+(c?c.name:'')+' '+o.origin+' '+o.destination+' '+(o.itemsSummary||'')).toLowerCase();if(hay.indexOf(q)>-1)out.push({t:o.id,s:(c?c.name:'')+' · '+o.origin+'→'+o.destination,go:"orderDetail('"+o.id+"')",ico:ICONS.box})});
  S.customers.forEach(function(c){if((c.name+' '+(c.contact||'')+' '+(c.city||'')).toLowerCase().indexOf(q)>-1)out.push({t:c.name,s:'Customer · '+(c.city||'—'),go:"custDetail('"+c.id+"')",ico:ICONS.users})});
  S.trackings.forEach(function(t){if((t.code+' '+t.carrier).toLowerCase().indexOf(q)>-1)out.push({t:t.code,s:'Shipment · '+TRK_STATUS[t.status],go:"trkDetail('"+t.id+"')",ico:ICONS.pin})});
  S.pos.forEach(function(p){var s=supById(p.supplierId);if((p.id+' '+(s?s.name:'')+' '+(p.description||'')).toLowerCase().indexOf(q)>-1)out.push({t:p.id,s:'PO · '+(s?s.name:'')+' · '+money(p.amount),go:"poEdit('"+p.id+"')",ico:ICONS.cart})});
  S.suppliers.forEach(function(s){if((s.name+' '+(s.category||'')+' '+(s.city||'')+' '+(s.contact||'')).toLowerCase().indexOf(q)>-1)out.push({t:s.name,s:'Supplier · '+(s.category||'—'),go:"supDetail('"+s.id+"')",ico:ICONS.cart})});
  var box=$('#search-results');
  if(!out.length){box.innerHTML='<div class="sr-empty">No results for “'+esc(q)+'”</div>'}
  else{box.innerHTML=out.slice(0,8).map(function(r){return '<button class="sr-item" onclick="hideSearch();document.getElementById(\'global-search\').value=\'\';'+r.go+'"><span class="sr-ico">'+r.ico+'</span><span><span class="sr-t">'+esc(r.t)+'</span><br><span class="sr-s">'+esc(r.s)+'</span></span></button>'}).join('')}
  box.classList.add('show');
}

/* offline: register service worker (works on the hosted site; skipped on file://) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  try{navigator.serviceWorker.register('sw.js').then(function(reg){
    var n=$('#storage-note');if(n&&reg.active)n.textContent='✅ Offline ready · data saved on this device as “myhub”';
  }).catch(function(){})}catch(e){}
}
})();
